services:
  backend:
    build: ./music_controller
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn music_controller.wsgi:application --bind 0.0.0.0:8000"
    environment:
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DB_PATH: /data/db.sqlite3
    volumes:
      - musicdb:/data
      - staticfiles:/app/staticfiles

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - staticfiles:/static
    depends_on:
      - backend

volumes:
  musicdb:
  staticfiles: